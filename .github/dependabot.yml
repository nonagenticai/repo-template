# Grouped weekly dependency updates. Keep ONE ecosystem block per package manager this
# repository actually uses; delete the rest. Grouping minor/patch keeps the PR count low
# without hiding a major upgrade, which stays a separate PR on purpose.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

