name: Bug report
description: Report something that does not work as documented.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first.
        Do **not** report security vulnerabilities here — use the repository's Security tab.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, commit hash, or "main at <date>".
      placeholder: v0.2.0 / 3c86920e
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the full error text if there is one.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and version, runtime/language version, and anything else the repository's README asks for.
      placeholder: |
        OS: macOS 15.2 / Ubuntu 24.04
        Runtime: Node 26.13.0 / Python 3.13 / Rust 1.99.1
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant output. Redact secrets, hostnames and tokens.
      render: shell
    validations:
      required: false
